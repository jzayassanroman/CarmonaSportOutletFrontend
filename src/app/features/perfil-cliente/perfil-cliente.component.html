<div *ngIf="cliente" class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-6">
  <h2 class="text-2xl font-bold mb-6 text-gray-800 flex items-center">
    <span class="bg-[#00D26A] p-2 rounded-full mr-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    </span>
    Perfil de Cliente
  </h2>

  <form (ngSubmit)="guardarEdicion()" class="space-y-5">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- Nombre -->
      <div class="relative">
        <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre:</label>
        <input
          id="nombre"
          [(ngModel)]="cliente.nombre"
          name="nombre"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#00D26A] focus:border-[#00D26A] transition-colors"
        />
      </div>

      <!-- Apellido -->
      <div class="relative">
        <label for="apellido" class="block text-sm font-medium text-gray-700 mb-1">Apellido:</label>
        <input
          id="apellido"
          [(ngModel)]="cliente.apellido"
          name="apellido"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#00D26A] focus:border-[#00D26A] transition-colors"
        />
      </div>
    </div>

    <!-- Email -->
    <div class="relative">
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico:</label>
      <div class="relative">
        <input
          id="email"
          [(ngModel)]="cliente.email"
          name="email"
          required
          class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#00D26A] focus:border-[#00D26A] transition-colors"
        />
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Teléfono -->
    <div class="relative">
      <label for="telefono" class="block text-sm font-medium text-gray-700 mb-1">Teléfono:</label>
      <div class="relative">
        <input
          id="telefono"
          [(ngModel)]="cliente.telefono"
          name="telefono"
          required
          class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#00D26A] focus:border-[#00D26A] transition-colors"
        />
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Dirección -->
    <div class="relative">
      <label for="direccion" class="block text-sm font-medium text-gray-700 mb-1">Dirección:</label>
      <div class="relative">
        <input
          id="direccion"
          [(ngModel)]="cliente.direccion"
          name="direccion"
          required
          class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#00D26A] focus:border-[#00D26A] transition-colors"
        />
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Provincia -->
    <div class="relative">
      <label for="provincia" class="block text-sm font-medium text-gray-700 mb-1">Provincia:</label>
      <div class="relative">
        <select
          id="provincia"
          [(ngModel)]="cliente.provincia"
          name="provincia"
          required
          class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg appearance-none focus:ring-2 focus:ring-[#00D26A] focus:border-[#00D26A] transition-colors"
        >
          <option *ngFor="let provincia of provincias" [value]="provincia">{{ provincia }}</option>
        </select>
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Tarjeta de crédito animada y formulario -->
    <div class="mt-10">
      <h3 class="text-xl font-bold mb-4 text-gray-800">Información de Tarjeta</h3>

      <div class="credit-card-container mb-12 mx-auto">
        <div class="credit-card" [class.flipped]="isCardFlipped">
          <div class="front">
            <div class="logo">VISA</div>
            <div class="number">{{ cardNumberDisplay }}</div>
            <div class="info">
              <div class="label">Titular</div>
              <div class="value">{{ cardName || 'NOMBRE APELLIDO' }}</div>
              <div class="label">Expira</div>
              <div class="value">{{ cardExpiry || 'MM/AA' }}</div>
            </div>
          </div>
          <div class="back">
            <div class="stripe"></div>
            <div class="cvv">{{ cardCVV || '•••' }}</div>
          </div>
        </div>
      </div>

      <h4 class="text-lg font-medium text-gray-700 mb-3">Ingrese los datos de su tarjeta</h4>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input [(ngModel)]="cardNumber" name="cardNumber" placeholder="Número de Tarjeta" maxlength="19"
               (focus)="isCardFlipped = false" class="form-input" />
        <input [(ngModel)]="cardName" name="cardName" placeholder="Nombre en la Tarjeta"
               (focus)="isCardFlipped = false" class="form-input" />
        <input [(ngModel)]="cardExpiry" name="cardExpiry" placeholder="Fecha de Expiración (MM/AA)"
               (focus)="isCardFlipped = false" class="form-input" />
        <input [(ngModel)]="cardCVV" name="cardCVV" placeholder="CVV" maxlength="4"
               (focus)="isCardFlipped = true" class="form-input" />
      </div>

      <div class="mt-4 flex items-center">
        <input type="checkbox" id="guardarTarjeta" [(ngModel)]="guardarTarjeta" name="guardarTarjeta"
               class="mr-2 h-4 w-4 accent-[#00D26A]" />
        <label for="guardarTarjeta" class="text-sm text-gray-700">Guardar tarjeta para futuras compras</label>
      </div>
    </div>

    <!-- Botón movido al final después del checkbox -->
    <div class="pt-6">
      <button
        type="submit"
        class="w-full px-6 py-3 bg-[#00D26A] text-white font-medium rounded-lg hover:bg-[#00B05A] focus:outline-none focus:ring-2 focus:ring-[#00D26A] focus:ring-offset-2 transition-colors flex items-center justify-center"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
        </svg>
        Guardar Cambios
      </button>
    </div>
  </form>
</div>
