<section class="flex justify-center items-center">
  <div class="flex space-x-2 justify-center items-center">
    <img src="assets/M+NK+CLUB+BB+FZ+HOODIE.png" alt="Producto 1" class="h-auto max-h-80 object-contain">
    <img src="assets/NIKE+AIR+180.png" alt="Producto 2" class="h-auto max-h-80 object-contain">
    <img src="assets/NIKE.png" alt="Producto 3" class="h-auto max-h-80 object-contain">
    <img src="assets/pantalonesnike.png" alt="Producto 4" class="h-auto max-h-80 object-contain">
  </div>
</section>

<app-tarjetahome></app-tarjetahome>
<!-- Botón flotante  -->
<button
  *ngIf="isLoggedIn"
  (click)="toggleFormulario()"
  class="fixed bottom-8 right-8 bg-green-500 text-white rounded-full w-16 h-16 flex items-center justify-center
         shadow-lg hover:bg-green-600 hover:scale-105 transition-all duration-300 ease-in-out z-40">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </svg>
</button>

<div *ngIf="mostrarFormulario"
     class="fixed top-10 right-20 flex justify-end items-start z-50"
     (click)="cerrarFormulario()">

  <!-- Panel flotante del formulario -->
  <div class="bg-white w-full max-w-md rounded-lg shadow-2xl transition-all duration-300 relative z-50"
       (click)="$event.stopPropagation()">

    <!-- Cabecera del formulario -->
    <div class="bg-green-500 text-white p-4 flex justify-between items-center sticky top-0 rounded-t-lg">
      <h2 class="text-xl font-semibold">Crear Producto</h2>
      <button (click)="cerrarFormulario()" class="rounded-full p-1 hover:bg-green-600 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Contenido del formulario con scroll interno -->
    <div class="p-6 max-h-[75vh] overflow-y-auto">
      <form (ngSubmit)="crearProducto()" class="flex flex-col space-y-4">

        <!-- Nombre -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
          <input type="text" [(ngModel)]="producto.nombre" name="nombre" required
                 class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all">
        </div>

        <!-- Tipo -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
          <select [(ngModel)]="producto.tipo" name="tipo" required
                  class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all appearance-none bg-white">
            <option value="" disabled selected>Seleccionar tipo</option>
            <option *ngFor="let tipo of tipos" [value]="tipo">{{ tipo }}</option>
          </select>
        </div>

        <!-- Descripción -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
          <textarea [(ngModel)]="producto.descripcion" name="descripcion" rows="3" required
                    class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all"></textarea>
        </div>

        <!-- Precio -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Precio</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">€</span>
            <input type="number" [(ngModel)]="producto.precio" name="precio" required step="0.01" min="0"
                   class="w-full p-2 pl-8 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all">
          </div>
        </div>

        <!-- Estado -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
          <select [(ngModel)]="producto.estado" name="estado" required
                  class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all appearance-none bg-white">
            <option value="" disabled selected>Seleccionar estado</option>
            <option *ngFor="let estado of estados" [ngValue]="estado.value">{{ estado.label }}</option>
          </select>
        </div>


        <!-- Imágenes -->
        <div class="border border-gray-200 rounded-md p-4 bg-gray-50">
          <h3 class="text-md font-medium mb-3">Imágenes del producto</h3>
          <div class="space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Imagen 1 (URL)</label>
              <input type="text" [(ngModel)]="producto.imagen1" name="imagen1"
                     class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Imagen 2 (URL)</label>
              <input type="text" [(ngModel)]="producto.imagen2" name="imagen2"
                     class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Imagen 3 (URL)</label>
              <input type="text" [(ngModel)]="producto.imagen3" name="imagen3"
                     class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Imagen 4 (URL)</label>
              <input type="text" [(ngModel)]="producto.imagen4" name="imagen4"
                     class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all">
            </div>
          </div>
        </div>

        <!-- Botón de enviar -->
        <button type="submit"
                class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg transition-all">
          Crear Producto
        </button>

        <!-- Botón de cancelar -->
        <button type="button" (click)="cerrarFormulario()"
                class="w-full bg-white text-gray-700 p-3 rounded-md border border-gray-300 hover:bg-gray-100 transition-colors font-medium">
          Cancelar
        </button>
      </form>
    </div>
  </div>
</div>
