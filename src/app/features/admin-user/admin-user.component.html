<div class="min-h-screen bg-gray-100">
  <!-- Barra lateral verde -->
  <div class="fixed left-0 top-0 h-full w-16 bg-[#00D26A] flex flex-col items-center py-6">
    <button class="text-white mb-6">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <!-- Contenido principal -->
  <div class="ml-16 px-4 py-6 md:px-8">
    <h1 class="text-2xl font-bold text-center uppercase mb-6">Administrar Usuarios</h1>

    <!-- Barra de búsqueda -->
    <div class="max-w-2xl mx-auto mb-8">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <input
          type="search"
          class="block w-full p-3 pl-10 text-sm border border-gray-300 rounded-lg bg-white"
          placeholder="Buscar"
          [(ngModel)]="textoBusqueda"
        />
      </div>
    </div>

    <!-- Tabla de usuarios -->
    <div class="max-w-6xl mx-auto overflow-x-auto bg-white rounded-lg shadow">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
        <tr>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rol</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
        </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let usuario of usuariosFiltrados">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
            {{ usuario.cliente?.nombre }} {{ usuario.cliente?.apellido }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            {{ usuario.cliente?.email }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ usuario.rol }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
              <span
                [ngClass]="{
                  'bg-green-100 text-green-800': usuario.isVerified,
                  'bg-red-100 text-red-800': !usuario.isVerified
                }"
                class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full">
                {{ usuario.isVerified ? 'Verificado' : 'No verificado' }}
              </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
            <div class="flex space-x-2">
              <button (click)="eliminarUsuario(usuario.id!)" class="text-red-600 hover:text-red-900">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
