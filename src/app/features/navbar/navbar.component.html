<nav class="flex items-center justify-between bg-white shadow-sm border-b-2 border-green-600">
  <!-- Logo -->
  <div class="flex items-center space-x-4 ml-8">
    <img
      src="../../../assets/image_29.png"
      alt="Carmona Sport Outlet Logo"
      class="w-36 h-36 "
    >
    <span class="text-3xl font-bold">
      <span class="text-black">Carmona</span>
      <span class="text-green-600">Sport</span>
      <span class="text-black">Outlet</span>
    </span>
  </div>

  <!-- Search Bar -->
  <div class="flex items-center justify-center flex-grow">
    <div class="relative w-full max-w-md">
      <input
        type="text"
        placeholder="Busqueda"
        class="w-full pl-4 pr-10 py-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-green-500"
      >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 w-5 h-5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
    </div>
  </div>

  <!-- Icons -->
  <div class="flex items-center space-x-6 mr-16">
    <button class="text-gray-600 hover:text-green-600 transition-colors" (click)="goToFavorites()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        class="w-8 h-8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
        />
      </svg>
    </button>
    <button class="text-gray-600 hover:text-green-600 transition-colors">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        class="w-8 h-8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
        />
      </svg>
    </button>

    <!-- Botón de usuario con dropdown -->
    <div class="relative" (document:click)="closeDropdown($event)">
      <button id="userMenuButton"
              (click)="toggleDropdown()"
              [attr.aria-expanded]="showDropdown"
              aria-haspopup="true"
              class="text-gray-600 hover:text-green-600 transition-colors focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-1 rounded-full p-1">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          class="w-8 h-8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          />
        </svg>
      </button>

      <!-- Dropdown menu dentro del botón -->
      <div *ngIf="showDropdown"
           id="userDropdown"
           class="absolute right-0 mt-3 w-56 bg-white border border-gray-100 rounded-lg shadow-lg z-10 transform origin-top-right transition-all duration-150 ease-out"
           role="menu"
           aria-labelledby="userMenuButton">
        <div class="py-2 px-1">
          <!-- Mis Productos y Cerrar Sesión solo cuando está logueado -->
          <div *ngIf="isLoggedIn" class="space-y-1">
            <a routerLink="/mis-productos"
               class="flex items-center px-4 py-3 text-gray-700 hover:bg-green-50 rounded-md hover:text-green-600 transition-all duration-150"
               role="menuitem">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
              </svg>
              <span>Mis Productos</span>
            </a>

            <div class="border-t border-gray-100 my-1"></div>

            <button (click)="logout()"
                    class="flex items-center w-full px-4 py-3 text-gray-700 hover:bg-green-50 rounded-md hover:text-green-600 transition-all duration-150"
                    role="menuitem">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              <span>Cerrar Sesión</span>
            </button>
          </div>

          <!-- Iniciar Sesión solo cuando NO está logueado -->
          <div *ngIf="!isLoggedIn">
            <a routerLink="/login"
               class="flex items-center px-4 py-3 text-gray-700 hover:bg-green-50 rounded-md hover:text-green-600 transition-all duration-150"
               role="menuitem">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
              </svg>
              <span>Iniciar Sesión</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
