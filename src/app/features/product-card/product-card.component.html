<!-- product-card.component.html -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 p-6">
  <div *ngFor="let product of products"
       (click)="verProducto(product)"
       class="bg-white border border-gray-200 rounded-3xl shadow-md p-5 flex flex-col relative cursor-pointer hover:shadow-lg transition-shadow duration-300">

    <div class="relative mb-4">
      <div class="carousel-container overflow-hidden rounded-xl relative">
        <div class="carousel-inner flex transition-transform duration-300 ease-in-out"
             [style.transform]="'translateX(-' + (product.currentImageIndex * 100) + '%)'">
          <img *ngFor="let image of product.images"
               [src]="image"
               alt="{{ product.name }}"
               class="w-full h-48 object-cover flex-shrink-0 rounded-xl">
        </div>

        <!-- Flechas de navegación -->
        <button *ngIf="product.images.length > 1"
                (click)="prevImage(product)"
                class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white/70 hover:bg-white text-gray-700 rounded-full p-2 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>
        </button>
        <button *ngIf="product.images.length > 1"
                (click)="nextImage(product)"
                class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white/70 hover:bg-white text-gray-700 rounded-full p-2 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>

      <!-- Indicadores de posición -->
      <div *ngIf="product.images.length > 1" class="flex justify-center mt-3 space-x-1.5">
        <span *ngFor="let image of product.images; let i = index"
              class="h-2.5 w-2.5 rounded-full transition-colors duration-300"
              [ngClass]="{
                'bg-green-600': product.currentImageIndex === i,
                'bg-gray-300': product.currentImageIndex !== i
              }">
        </span>
      </div>
    </div>

    <div class="flex flex-col items-start gap-1">
      <h3 class="text-xl font-semibold text-gray-800 leading-snug">{{ product.name }}</h3>
      <p class="text-green-600 font-bold text-lg">{{ product.price }}€</p>

      <button (click)="eliminarProducto(product); $event.stopPropagation()"
              class="mt-3 bg-red-500 text-white px-4 py-2 rounded-xl w-full font-semibold hover:bg-red-600 transition-colors">
        Eliminar
      </button>
    </div>

    <div class="absolute top-4 right-4 text-green-500">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
      </svg>
    </div>
  </div>
</div>
