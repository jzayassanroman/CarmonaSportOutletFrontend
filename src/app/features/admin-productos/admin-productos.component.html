<div class="min-h-screen bg-gray-100 relative">
  <!-- Barra lateral verde -->
  <div class="fixed left-0 top-0 h-full w-16 bg-[#00D26A] flex flex-col items-center py-6 z-50">
    <!-- Botón desplegable -->
    <button class="text-white mb-6 relative" (click)="toggleMenu()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>

      <!-- Menú desplegable -->
      <div *ngIf="menuVisible"
           class="absolute left-full top-0 ml-2 bg-white text-black rounded shadow-lg w-40">
        <ul class="text-left">
          <li class="px-4 py-2 hover:bg-gray-200 cursor-pointer" (click)="navigateTo('admin-user')">Admin Usuarios</li>
          <li class="px-4 py-2 hover:bg-gray-200 cursor-pointer" (click)="navigateTo('admin-productos')">Admin Productos</li>
        </ul>
      </div>
    </button>
  </div>

  <!-- Contenido principal -->
  <div class="ml-16 px-4 py-6 md:px-8">
    <h1 class="text-2xl font-bold text-center uppercase mb-6">Administrar Productos</h1>

    <!-- Barra de búsqueda -->
    <div class="max-w-2xl mx-auto mb-8">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <input
          type="search"
          class="block w-full p-3 pl-10 text-sm border border-gray-300 rounded-lg bg-white"
          placeholder="Buscar"
          [(ngModel)]="textoBusqueda"
        />
      </div>
    </div>


    <!-- Tabla de productos -->
    <div class="max-w-6xl mx-auto overflow-x-auto bg-white rounded-lg shadow">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
        <tr>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cliente</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descripción</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Eliminar</th>
        </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let producto of productosFiltrados">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ producto.nombre }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ producto.nombreCliente }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ producto.descripcion }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
              <span
                [ngClass]="{
                  'bg-red-100 text-red-800': producto.estado === 0,
                  'bg-yellow-100 text-yellow-800': producto.estado === 1,
                  'bg-blue-100 text-blue-800': producto.estado === 2,
                  'bg-green-100 text-green-800': producto.estado === 3
                }"
                class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full">
                {{ obtenerNombreEstado(producto.estado) }}
              </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
            <div class="flex space-x-2">
              <button (click)="eliminarProducto(producto.id!)" class="text-red-600 hover:text-red-900">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal de Creación -->
  <div *ngIf="modalCrearVisible" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto">
      <div class="border-b px-6 py-3 flex justify-between items-center">
        <h3 class="text-lg font-medium text-gray-900">Crear Nuevo Producto</h3>
        <button (click)="cerrarModalCrear()" class="text-gray-400 hover:text-gray-500">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <form (submit)="agregarProducto()" class="p-6">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Nombre</label>
          <input type="text" [(ngModel)]="nuevoProducto.nombre" name="nombre" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Tipo</label>
          <input type="text" [(ngModel)]="nuevoProducto.tipo" name="tipo" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Descripción</label>
          <textarea [(ngModel)]="nuevoProducto.descripcion" name="descripcion" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required></textarea>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Precio</label>
          <input type="number" [(ngModel)]="nuevoProducto.precio" name="precio" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">URL Imagen</label>
          <input type="text" [(ngModel)]="nuevoProducto.imagen1" name="imagen1" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Tipo de entrega</label>
          <select [(ngModel)]="nuevoProducto.entrega" name="entrega" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
            <option *ngFor="let entrega of entregas" [value]="entrega.value">{{ entrega.label }}</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Estado</label>
          <select [(ngModel)]="nuevoProducto.estado" name="estado" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
            <option *ngFor="let estado of estados" [value]="estado.value">{{ estado.label }}</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Disponibilidad</label>
          <div class="mt-1">
            <label class="inline-flex items-center">
              <input type="radio" [value]="true" [(ngModel)]="nuevoProducto.disponible" name="disponible" class="form-radio">
              <span class="ml-2">Disponible</span>
            </label>
            <label class="inline-flex items-center ml-6">
              <input type="radio" [value]="false" [(ngModel)]="nuevoProducto.disponible" name="disponible" class="form-radio">
              <span class="ml-2">No disponible</span>
            </label>
          </div>
        </div>
        <div class="mt-5 flex justify-end">
          <button type="button" (click)="cerrarModalCrear()" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md mr-3">Cancelar</button>
          <button type="submit" class="bg-[#00D26A] text-white px-4 py-2 rounded-md">Crear Producto</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de Edición -->
  <div *ngIf="productoEnEdicion" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto">
      <div class="border-b px-6 py-3 flex justify-between items-center">
        <h3 class="text-lg font-medium text-gray-900">Editar Producto: {{ productoEnEdicion.nombre }}</h3>
        <button (click)="cancelarEdicion()" class="text-gray-400 hover:text-gray-500">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <form (submit)="guardarEdicion()" class="p-6">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Nombre</label>
          <input type="text" [(ngModel)]="productoEnEdicion.nombre" name="editNombre" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Tipo</label>
          <input type="text" [(ngModel)]="productoEnEdicion.tipo" name="editTipo" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Descripción</label>
          <textarea [(ngModel)]="productoEnEdicion.descripcion" name="editDescripcion" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required></textarea>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Precio</label>
          <input type="number" [(ngModel)]="productoEnEdicion.precio" name="editPrecio" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">URL Imagen</label>
          <input type="text" [(ngModel)]="productoEnEdicion.imagen1" name="editImagen1" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Tipo de entrega</label>
          <select [(ngModel)]="productoEnEdicion.entrega" name="editEntrega" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
            <option *ngFor="let entrega of entregas" [value]="entrega.value">{{ entrega.label }}</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Estado</label>
          <select [(ngModel)]="productoEnEdicion.estado" name="editEstado" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
            <option *ngFor="let estado of estados" [value]="estado.value">{{ estado.label }}</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Disponibilidad</label>
          <div class="mt-1">
            <label class="inline-flex items-center">
              <input type="radio" [value]="true" [(ngModel)]="productoEnEdicion.disponible" name="editDisponible" class="form-radio">
              <span class="ml-2">Disponible</span>
            </label>
            <label class="inline-flex items-center ml-6">
              <input type="radio" [value]="false" [(ngModel)]="productoEnEdicion.disponible" name="editDisponible" class="form-radio">
              <span class="ml-2">No disponible</span>
            </label>
          </div>
        </div>
        <div class="mt-5 flex justify-end">
          <button type="button" (click)="cancelarEdicion()" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md mr-3">Cancelar</button>
          <button type="submit" class="bg-[#00D26A] text-white px-4 py-2 rounded-md">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>
