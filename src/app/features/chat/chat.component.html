<div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-2xl overflow-hidden h-[85vh] sm:h-[80vh] lg:h-[75vh] flex flex-col border border-gray-100 my-8 sm:my-12">

  <!-- Header del chat -->
  <div class="bg-gradient-to-r from-green-600 to-green-700 text-white px-4 sm:px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
      </div>
      <div>
        <h1 class="font-semibold text-lg">Chat</h1>
      </div>
    </div>
  </div>

  <!-- Área de mensajes -->
  <div class="overflow-y-auto flex-1 bg-gradient-to-b from-gray-50 to-white space-y-4 p-4 sm:p-6" id="chat-box">
    <div *ngFor="let message of messages" class="flex transition-all duration-300 ease-in-out hover:scale-105" [ngClass]="{ 'justify-end': message.emisorId === currentUserId, 'justify-start': message.emisorId !== currentUserId }">

      <!-- Mensaje de otro usuario -->
      <div *ngIf="message.emisorId !== currentUserId" class="flex items-start space-x-3 max-w-xs sm:max-w-sm lg:max-w-md">
        <div class="w-8 h-8 bg-gray-600 rounded-full flex items-center justify-center flex-shrink-0">
          <span class="text-white text-sm font-medium">U</span>
        </div>
        <div class="bg-white text-gray-600 px-4 py-3 rounded-2xl rounded-tl-md shadow-md border border-gray-100 break-words">
          <p class="text-sm leading-relaxed">{{ message.contenido }}</p>
        </div>
      </div>

      <!-- Mensaje propio -->
      <div *ngIf="message.emisorId === currentUserId" class="flex items-start space-x-3 max-w-xs sm:max-w-sm lg:max-w-md flex-row-reverse">
        <div class="w-8 h-8 bg-green-600 rounded-full flex items-center justify-center flex-shrink-0">
          <span class="text-white text-sm font-medium">T</span>
        </div>
        <div class="bg-gradient-to-br from-green-600 to-green-700 text-white px-4 py-3 rounded-2xl rounded-tr-md shadow-lg break-words">
          <p class="text-sm leading-relaxed">{{ message.contenido }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Formulario de envío -->
  <div class="bg-white border-t border-gray-100 p-4 sm:p-6">
    <form (submit)="sendMessage()" class="flex items-end space-x-3 sm:space-x-4">
      <div class="flex-1 relative">
        <input
          [(ngModel)]="newMessage"
          name="message"
          placeholder="Escribe un mensaje..."
          class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent transition-all duration-200 placeholder-gray-400 text-gray-600"
        />
      </div>
      <button
        type="submit"
        class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-6 py-3 rounded-2xl transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-lg hover:shadow-xl font-medium"
      >
        Enviar
      </button>
    </form>
  </div>
</div>
