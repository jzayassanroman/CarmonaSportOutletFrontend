<div class="flex justify-center items-center min-h-screen bg-white p-4">
  <div class="bg-white border-2 border-green-400 rounded-lg p-6 w-full max-w-md">
    <h2 class="text-xl font-bold text-center text-black mb-6">Inicio de sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-4">

      <!-- Username Input -->
      <div>
        <input
          id="username"
          type="email"
          formControlName="username"
          class="w-full px-3 py-2 border border-black rounded-md focus:outline-none focus:ring-1 focus:ring-green-500"
          placeholder="Correo electrónico" />
      </div>

      <!-- Password Input -->
      <div>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="w-full px-3 py-2 border border-black rounded-md focus:outline-none focus:ring-1 focus:ring-green-500"
          placeholder="Contraseña" />
      </div>

      <!-- Error Message -->
      <p *ngIf="errorMessage" class="text-red-500 text-sm">{{ errorMessage }}</p>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-green-500 text-white py-3 px-4 rounded-md hover:bg-green-600 transition disabled:bg-gray-400 font-medium mt-2"
        [disabled]="loading || loginForm.invalid">
        {{ loading ? 'Iniciando...' : 'Iniciar Sesión' }}
      </button>

      <!-- Register Link -->
      <div class="text-center mt-4 text-sm">
        ¿No tienes cuenta? <a href="#" class="text-green-500 hover:underline">Crear cuenta</a>
      </div>
    </form>
  </div>
</div>
